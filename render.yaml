services:
  - type: web
    name: motorcycles-shop
    runtime: docker
    repo: https://github.com/satpanha110-netizen/Motorcycles-
    branch: master
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://motorcycles-shop.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: db.luqdffydlebfsbkabgtv.supabase.co
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        value: q2!xB?Q53jSuQcH
      - key: RUN_MIGRATIONS
        value: "true"
      - key: IMAGE_STORAGE_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-2
      - key: AWS_BUCKET
        value: MotorcycleImage
      - key: AWS_ENDPOINT
        value: https://wspqrqshmdxjohzbntrx.storage.supabase.co/storage/v1/s3
      - key: AWS_URL
        value: https://wspqrqshmdxjohzbntrx.supabase.co/storage/v1/object/public/MotorcycleImage
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"